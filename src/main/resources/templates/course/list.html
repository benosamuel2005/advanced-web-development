
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Course Management</title>

    <!-- External CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 24px;
            background: #f4f6f9;
            color: #263445;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            gap: 20px;
        }

        h1 {
            font-size: 28px;
            margin: 0;
        }

        .subtitle {
            color: #718096;
            font-size: 14px;
        }

        .card {
            background: white;
            border: 1px solid #e5eaf0;
            border-radius: 12px;
            overflow-x: auto;
            box-shadow: 0 4px 18px rgba(0,0,0,.04);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f8fafc;
            color: #64748b;
            text-align: left;
            font-size: 12px;
            padding: 17px 22px;
            text-transform: uppercase;
        }

        td {
            padding: 17px 22px;
            border-bottom: 1px solid #edf0f4;
            font-size: 14px;
        }

        tbody tr:hover {
            background: #f8fbff;
        }

        .btn {
            display: inline-block;
            padding: 10px 16px;
            border: none;
            border-radius: 7px;
            font-size: 13px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .primary:hover {
            background: #1d4ed8;
        }

        .edit {
            background: #eff6ff;
            color: #2563eb;
        }

        .edit:hover {
            background: #dbeafe;
        }

        .delete {
            background: #fff1f2;
            color: #dc2626;
        }

        .delete:hover {
            background: #ffe4e6;
        }

        .capacity {
            display: inline-block;
            background: #eef4ff;
            color: #315da8;
            padding: 5px 11px;
            border-radius: 20px;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .actions form {
            margin: 0;
        }

        .footer {
            margin-top: 22px;
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
        }

        @media (max-width: 650px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            body {
                padding: 20px 12px;
            }

            .actions {
                flex-wrap: wrap;
            }
        }
    </style>

</head>

<body>

<div class="container">

    <!-- Shared Navigation Bar -->
    <div th:replace="~{fragments/navigation :: navigation(active='courses')}"></div>

    <!-- Page Header -->
    <div class="header">

        <div>
            <h1>Course Management</h1>

            <p class="subtitle">
                Manage your courses, trainers and capacity.
            </p>
        </div>

        <!-- Add New Course Button -->
        <a class="btn primary"
           th:href="@{/course-management/new}">
            + Add New Course
        </a>

    </div>

    <!-- Course Table -->
    <div class="card">

        <table>

            <thead>
            <tr>
                <th>ID</th>
                <th>Course Name</th>
                <th>Capacity</th>
                <th>Trainer</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>

            <!-- Display All Courses -->
            <tr th:each="course : ${courses}">

                <!-- Course ID -->
                <td th:text="${course.id}"></td>

                <!-- Course Name -->
                <td th:text="${course.name}"></td>

                <!-- Course Capacity -->
                <td>
                    <span class="capacity"
                          th:text="${course.capacity} + ' places'">
                    </span>
                </td>

                <!-- Assigned Trainer -->
                <td th:text="${course.trainer != null ? course.trainer.name : 'Not assigned'}">
                </td>

                <!-- Action Buttons -->
                <td>

                    <div class="actions">

                        <!-- Edit Button -->
                        <a class="btn edit"
                           th:href="@{/course-management/{id}/edit(id=${course.id})}">
                            Edit
                        </a>

                        <!-- Delete Button -->
                        <form th:action="@{/course-management/{id}/delete(id=${course.id})}"
                              method="post">

                            <button class="btn delete"
                                    type="submit"
                                    onclick="return confirm('Are you sure you want to delete this course?');">
                                Delete
                            </button>

                        </form>

                    </div>

                </td>

            </tr>

            <!-- Display Message If No Courses Exist -->
            <tr th:if="${#lists.isEmpty(courses)}">

                <td colspan="5"
                    style="text-align:center; padding:40px;">

                    No courses found. Add your first course.

                </td>

            </tr>

            </tbody>

        </table>

    </div>

    <!-- Footer -->
    <div class="footer">
        Advanced Web Development - Course Management Demo
    </div>

</div>

</body>
</html>
